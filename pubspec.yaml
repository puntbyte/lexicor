name: lexicor
description: >-
  An optimized, strictly typed, offline interface for the Open English WordNet database.
  Supports lightweight (no definitions) and full (with definitions) modes.
version: 0.2.0

repository: https://github.com/puntbyte/lexicor
homepage: https://github.com/puntbyte/lexicor
issue_tracker: https://github.com/puntbyte/lexicor/issues
topics:
  - wordnet
  - dictionary
  - nlp
  - semantics
  - thesaurus

environment:
  sdk: ^3.10.0

flutter:
  assets:
    - lib/assets/dictionary.sqlite
    - lib/assets/dictionary_full.sqlite

dependencies:
  meta: ^1.16.0
  sqlite3: ^2.8.0

dev_dependencies:
  melos: ^7.3.0
  path: ^1.9.1
  test: ^1.26.0
  very_good_analysis: ^10.0.0

melos:
  useRootAsPackage: true

  scripts:
    build:
      description: Build light database (no definitions, ~28 MB)
      run: dart run tool/build_database.dart tool/db/oewn.sqlite

    build:full:
      description: Build full database (definitions + examples, ~40 MB)
      run: dart run tool/build_database.dart tool/db/oewn.sqlite --full

    build:all:
      description: Build both databases
      run: dart run tool/build_database.dart tool/db/oewn.sqlite --all
